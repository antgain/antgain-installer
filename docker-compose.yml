services:
  antgain:
    image: pinors/antgain-cli:latest
    container_name: antgain
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      - ANTGAIN_API_KEY=${ANTGAIN_API_KEY}
      # Optional. Omit to auto-generate a UUID on the data volume.
      - ANTGAIN_DEVICE_ID=${ANTGAIN_DEVICE_ID:-}
    volumes:
      - ${ANTGAIN_HOST_DATA_DIR:-${HOME}/.antgain}:/data/.antgain
    healthcheck:
      test: ["CMD", "antgain", "health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s
